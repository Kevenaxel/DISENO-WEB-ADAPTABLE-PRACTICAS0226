<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Practica 2 - Variables, Animaciones y Keyframes</title>
</head>
<body>
    <section class="pedidos">
  <header class="pedidos__header">
    <div>
      <p class="eyebrow">Actividad reciente</p>
      <h1>Pedidos</h1>
    </div>

    <span class="estado-sistema">
      <span class="estado-sistema__punto"></span>
      Sistema activo
    </span>
  </header>

  <div class="pedidos__grid">

    <article class="pedido" data-estado="nuevo">
      <span class="pedido__estado">Nuevo</span>
      <h2>Pedido #1048</h2>
      <p>2 cafés · 1 croissant</p>
      <strong>$8.50</strong>
    </article>

    <article class="pedido" data-estado="proceso">
      <span class="pedido__estado">Preparando</span>
      <h2>Pedido #1047</h2>
      <p>1 cappuccino · 2 brownies</p>
      <strong>$11.75</strong>
    </article>

    <article class="pedido" data-estado="listo">
      <span class="pedido__estado">Listo</span>
      <h2>Pedido #1046</h2>
      <p>2 lattes</p>
      <strong>$7.00</strong>
    </article>

  </div>
</section>
</body>
</html>
